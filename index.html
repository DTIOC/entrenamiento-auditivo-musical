<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Entrenamiento Auditivo - Niveles Progresivos</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=14">
    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎹 Entrenamiento Auditivo</h1>
            <p>Escucha y repite las notas en el teclado</p>
        </header>

        <div class="student-info">
            <h3> Registro de datos (obligatorio)</h3>
            <p style="margin-bottom: 10px; opacity: 0.8;">Llena estos campos antes de comenzar.</p>
            <input type="email" id="studentEmail" placeholder="Correo institucional" required>
            <input type="text" id="studentName" placeholder="Nombre completo" required>
            <input type="text" id="studentGroup" placeholder="Grupo" required>
            
            <!-- CAMPO: Profesor -->
            <select id="studentTeacher" required style="width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 5px; background: rgba(255, 255, 255, 0.9); font-size: 1rem; color: #333;">
                <option value="">Selecciona tu profesor...</option>
                <option value="Oscar">Prof. Óscar</option>
                <option value="Rene">Prof. René Báez</option>
                <option value="Yazmin">Profra. Yazmín Guzmán</option>
            </select>
        </div>

        <div class="game-area">
            <div class="controls">
                <button id="btnMode" class="btn btn-info"> Modo Familiarización</button>
                <button id="btnPlay" class="btn btn-primary">▶️ Escuchar</button>
                <button id="btnGenerate" class="btn btn-secondary">🎲 Nuevo Ejercicio</button>
                <button id="btnCheck" class="btn btn-success">✓ Verificar</button>
                <button id="btnClear" class="btn btn-warning">🔄 Limpiar</button>
            </div>

            <div class="info-panel">
                <div class="scale-info">
                    <strong>Nivel:</strong> <span id="currentLevel" class="level-badge">1</span>
                </div>
                <div class="notes-info">
                    <strong>Notas:</strong> <span id="noteCount">0</span>
                </div>
                <div class="progress-info">
                    <strong>Progreso:</strong> <span id="levelProgress">0/2</span> para subir
                </div>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="score-display" id="scoreDisplay" style="display: none;">
                <h2>Calificación: <span id="scoreValue">0</span>/100</h2>
                <p id="feedbackText"></p>
            </div>
        </div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <script src="app.js?v=14"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('Service Worker no registrado:', err);
                });
            });
        }
    </script>
</body>
</html>
